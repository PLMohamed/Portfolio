version: "3.8"

services:
  db:
    image: postgres:13.21-alpine3.22
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - ${DATABASE_PORT}:${DATABASE_PORT}

  # Isolated database used by the integration tests.
  # It has its own volume and host port so it cannot touch the development DB.
  db-test:
    image: postgres:13.21-alpine3.22
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}_test
    volumes:
      - db_test_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:alpine3.21
    container_name: nextjs_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  serverless-redis:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    ports:
      - "8079:80"
    volumes:
      - serverless_redis_data:/data

volumes:
  db_data:
  db_test_data:
  redis_data:
  serverless_redis_data:
